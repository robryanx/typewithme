# typewithme under https://robserver.me/typewithme/
# Installed into the managed robserver.me HTTPS server block by
# ops/install-nginx-site.sh (which adds the include line that pulls this in).
client_max_body_size 26m;

location = /typewithme {
    return 301 /typewithme/;
}

# Only the front controller and compiled assets are reachable; everything
# else falls through to /typewithme/index.php, so repo sources (src/, api/,
# tests/, ops/, .env) are never served directly.
location ^~ /typewithme/ {
    root /home/rob;
    index index.php;
    try_files $uri $uri/ /typewithme/index.php?$query_string;

    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
    }

    location ~ \.php$ {
        deny all;
    }
}

location = /typewithme/index.php {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /home/rob/typewithme/index.php;
    # Voice recordings exceed PHP's defaults; keep uploads possible.
    fastcgi_param PHP_VALUE "upload_max_filesize=25M\npost_max_size=25M";
    fastcgi_pass unix:/run/php-fpm/php-fpm.sock;
}
